[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hass-buenosdias"
version = "0.3.0"
description = "A personalized morning radio for Home Assistant"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
  {name = "Francisco Abarzua", email = "pypi.dev@frabarz.cl"},
]
dependencies = [
  "feedparser",
  "httpx",
]

[project.urls]
Repository = "https://tangled.org/frabarz.cl/buenosdias"
Issues = "https://tangled.org/frabarz.cl/buenosdias/issues"

[tool.setuptools]
packages = ["custom_components", "custom_components.buenosdias"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff.lint]
ignore = ["ARG001"]
