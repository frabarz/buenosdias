name: Validate with hassfest

on:
  push:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: "actions/checkout@v7"

      - name: hassfest validation
        uses: "home-assistant/actions/hassfest@master"
