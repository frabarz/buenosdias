# DEPRECATED (v0.2.0): configuration is now managed through the UI config
# flow (Settings → Devices & Services → Add Integration → "Buenos Días").
#
# This YAML block is only a migration path: at startup it triggers a one-time
# import that creates a config entry (which you can then edit in the UI).
# Once an entry exists, this block is ignored — remove it to avoid the warning.
# The openrouter/base_url migrated from here is passed to the UI as defaults.
#
# If you currently use YAML, keep it, restart HA and confirm the import dialog;
# then delete this block.
# If you are new: skip YAML entirely, add the integration through the UI.

buenosdias:
  llm:
    # ha_conversation (use HA's conversation agent) | openai_compatible (OpenAI-style endpoint)
    mode: ha_conversation
    # agent: <conversation agent entity_id>   # optional, only for mode: ha_conversation
    max_chars: 2000
    # Fallback / mode openai_compatible (Ollama, OpenRouter, Groq, LM Studio...):
    openai:
      base_url: http://localhost:11434/v1
      api_key: !secret buenosdias_llm_api_key
      model: llama3

  tts:
    entity_id: tts.piper
    media_player: media_player.sala
    language: es-ES
    volume: 0.6
    restore_volume: true

  sources:
    weather:
      - weather.casa
    calendar:
      - calendar.familia
    sensors:
      - sensor.consumo_diario
    # Optional RSS feeds: city news and events.
    rss:
      feeds:
        - url: https://www.example.org/news/rss.xml
          kind: news          # news | events
          max_age_hours: 24
          max_items: 5
          tags: [city, current]
          # Optional: skip entries whose title or summary mentions any of
          # these keywords (accents are ignored: "futbol" catches "fútbol").
          exclude: [fútbol, farándula]
        - url: https://www.example.org/events/rss.xml
          kind: events
          max_age_hours: 168
          max_items: 8

  schedule:
    # Fixed time: "07:00". Dynamic alternative: time_entity reads the next
    # alarm from an entity (e.g. your phone app's alarm sensor) and the alarm
    # is re-registered whenever its state changes.
    time: "07:00"
    # time_entity: sensor.alarma_telefono
    skip_days: [sat, sun]
    feriados:
      - "2026-01-01"
    skip_if_emitted: true

  # The persona fully controls the script's language and style. Write it in
  # any language you want the script spoken in, e.g. a Spanish persona:
  #   "Eres el locutor de una radio matutina. Habla en español de España, con
  #    tono cercano y natural. Redacta un breve guion hablado."
  persona: |
    You are the host of a morning radio show. Speak in a warm, natural tone
    and write a short spoken script.
