# Example configuration for the "buenosdias" integration.
# Copy this block into your configuration.yaml (or services.home-assistant.config on NixOS).

buenosdias:
  llm:
    # ha_conversation (use HA's conversation agent) | openai_compatible (OpenAI-style endpoint)
    mode: ha_conversation
    # agent: <conversation agent entity_id>   # optional, only for mode: ha_conversation
    max_chars: 2000
    # Fallback / mode openai_compatible (Ollama, OpenRouter, Groq, LM Studio...):
    openai:
      base_url: http://localhost:11434/v1
      api_key: !secret buenosdias_llm_api_key
      model: llama3

  tts:
    entity_id: tts.piper
    media_player: media_player.sala
    language: es-ES
    volume: 0.6
    restore_volume: true

  sources:
    weather:
      - weather.casa
    calendar:
      - calendar.familia
    sensors:
      - sensor.consumo_diario
    # Optional RSS feeds: city news and events.
    rss:
      feeds:
        - url: https://www.example.org/news/rss.xml
          kind: news          # news | events
          max_age_hours: 24
          max_items: 5
          tags: [city, current]
        - url: https://www.example.org/events/rss.xml
          kind: events
          max_age_hours: 168
          max_items: 8

  schedule:
    # Fixed time: "07:00". Dynamic alternative: time_entity reads the next
    # alarm from an entity (e.g. your phone app's alarm sensor) and the alarm
    # is re-registered whenever its state changes.
    time: "07:00"
    # time_entity: sensor.alarma_telefono
    skip_days: [sat, sun]
    feriados:
      - "2026-01-01"
    skip_if_emitted: true

  # The persona fully controls the script's language and style. Write it in
  # any language you want the script spoken in, e.g. a Spanish persona:
  #   "Eres el locutor de una radio matutina. Habla en español de España, con
  #    tono cercano y natural. Redacta un breve guion hablado."
  persona: |
    You are the host of a morning radio show. Speak in a warm, natural tone
    and write a short spoken script.
